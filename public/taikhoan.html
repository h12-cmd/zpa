<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Quản Lý Tài Khoản & Log Hệ Thống</title>
    <style>
        body { background: #0f172a; color: #fff; font-family: sans-serif; padding: 20px; display: flex; justify-content: center; }
        .card { background: #1e293b; padding: 25px; border-radius: 8px; width: 100%; max-width: 900px; }
        .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #334155; padding-bottom: 15px; }
        .badge { background: #2563eb; padding: 6px 14px; border-radius: 20px; font-weight: bold; font-size: 14px; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { text-align: left; padding: 12px; border-bottom: 1px solid #334155; }
        th { background: #0f172a; color: #94a3b8; }
        .status-online { color: #10b981; font-weight: bold; }
        .status-offline { color: #ef4444; font-weight: bold; }
        .btn-action { background: #334155; color: #fff; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-size: 12px; }
        .btn-action:hover { background: #475569; }
        .log-box { background: #0f172a; padding: 10px; border-radius: 4px; font-family: monospace; font-size: 12px; max-height: 120px; overflow-y: auto; color: #cbd5e1; }
    </style>
</head>
<body>
    <div class="card">
        <div class="header">
            <h2>Quản Lý Tài Khoản Treo Voice</h2>
            <div class="badge">Tổng số: <span id="total">0</span> acc</div>
        </div>

        <table>
            <thead>
                <tr>
                    <th>Tài khoản</th>
                    <th>Thời gian treo</th>
                    <th>Token (Bảo mật)</th>
                    <th>Lịch sử Log / Lỗi</th>
                </tr>
            </thead>
            <tbody id="account-list">
                <tr><td colspan="4" style="text-align:center;">Đang tải dữ liệu...</td></tr>
            </tbody>
        </table>
    </div>

    <script>
        function formatUptime(ms) {
            if (!ms) return 'Offline';
            const sec = Math.floor((Date.now() - ms) / 1000);
            const hrs = Math.floor(sec / 3600);
            const mins = Math.floor((sec % 3600) / 60);
            return `${hrs} giờ ${mins} phút`;
        }

        async function fetchAccounts() {
            try {
                const res = await fetch('/api/accounts-management');
                const data = await res.json();

                document.getElementById('total').innerText = data.total;
                const tbody = document.getElementById('account-list');
                tbody.innerHTML = '';

                if (data.accounts.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="4" style="text-align:center; color:#94a3b8;">Chưa có dữ liệu tài khoản nào.</td></tr>';
                    return;
                }

                data.accounts.forEach(acc => {
                    const statusText = acc.isOnline 
                        ? `<span class="status-online">🟢 Online</span><br><small>${formatUptime(acc.connectedAt)}</small>` 
                        : `<span class="status-offline">🔴 Offline</span>`;

                    const logsText = acc.logs.length > 0 
                        ? acc.logs.join('<br>') 
                        : 'Chưa có ghi nhận lỗi.';

                    const row = `
                        <tr>
                            <td><strong>${acc.username}</strong></td>
                            <td>${statusText}</td>
                            <td>
                                <code>${acc.maskedToken}</code><br><br>
                                <button class="btn-action" onclick="revealToken()">Hiện Token</button>
                            </td>
                            <td>
                                <div class="log-box">${logsText}</div>
                            </td>
                        </tr>
                    `;
                    tbody.innerHTML += row;
                });
            } catch (e) {}
        }

        async function revealToken() {
            const userId = prompt('Nhập ID Discord người dùng (User ID) của tài khoản này để xem Token:');
            if (!userId) return;

            const res = await fetch('/api/reveal-token', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ userId: userId.trim() })
            });

            const data = await res.json();
            if (data.success) {
                alert(`Token của bạn là:\n\n${data.token}`);
            } else {
                alert(data.message);
            }
        }

        fetchAccounts();
        setInterval(fetchAccounts, 5000);
    </script>
</body>
</html>
