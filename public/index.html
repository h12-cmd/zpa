<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Treo Voice Discord 24/7</title>
    <style>
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body {
            background: #0b0f19;
            color: #f8fafc;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            padding: 16px;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .card {
            background: #161e2e;
            border: 1px solid #2d3748;
            border-radius: 16px;
            padding: 24px;
            width: 100%;
            max-width: 520px;
            box-shadow: 0 20px 30px rgba(0, 0, 0, 0.45);
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }
        h2 { margin: 0; font-size: 1.35rem; }
        .nav-links a {
            color: #38bdf8;
            text-decoration: none;
            font-size: 13px;
            font-weight: 600;
            margin-left: 12px;
        }
        .alert {
            background: rgba(127, 29, 29, 0.45);
            color: #fca5a5;
            border: 1px solid #7f1d1d;
            padding: 11px 14px;
            border-radius: 10px;
            font-size: 13px;
            line-height: 1.45;
            margin-bottom: 18px;
        }
        label {
            display: block;
            margin-top: 14px;
            font-weight: 600;
            font-size: 13px;
            color: #cbd5e1;
        }
        input[type="password"], input[type="text"] {
            width: 100%;
            padding: 12px 14px;
            margin-top: 6px;
            background: #0f172a;
            border: 1px solid #334155;
            color: #fff;
            border-radius: 10px;
            font-size: 14px;
            outline: none;
        }
        input:focus { border-color: #3b82f6; }
        .switches {
            display: flex;
            gap: 24px;
            margin: 18px 0;
        }
        .switches label {
            margin: 0;
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            font-size: 14px;
            color: #f1f5f9;
        }
        .switches input[type="checkbox"] {
            width: 18px;
            height: 18px;
            accent-color: #2563eb;
        }
        .btn-group {
            display: flex;
            gap: 10px;
        }
        button {
            flex: 1;
            padding: 13px;
            border: none;
            border-radius: 10px;
            font-weight: 700;
            font-size: 14px;
            color: #fff;
            cursor: pointer;
        }
        .btn-connect { background: #2563eb; }
        .btn-connect:hover { background: #1d4ed8; }
        .btn-disconnect { background: #dc2626; }
        .btn-disconnect:hover { background: #b91c1c; }
        .toast {
            margin-top: 16px;
            padding: 12px 14px;
            border-radius: 10px;
            font-size: 13px;
            line-height: 1.45;
            display: none;
        }
        @media (max-width: 480px) {
            .btn-group { flex-direction: column; }
            .card { padding: 18px; }
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="header">
            <h2>Treo Voice Discord</h2>
            <div class="nav-links">
                <a href="/check">Trạng thái</a>
                <a href="/setting">Cài đặt</a>
            </div>
        </div>

        <div class="alert">
            ⚠️ Khuyến nghị bật <strong>Tự Mute</strong> và <strong>Tự Deaf</strong> để giảm rủi ro bị Discord quét tài khoản.
        </div>

        <label>Token Tài Khoản Discord</label>
        <input type="password" id="token" placeholder="Nhập User Token của bạn...">

        <label>ID Kênh Thoại (Voice Channel ID)</label>
        <input type="text" id="channelId" placeholder="VD: 1530967867481395213">

        <div class="switches">
            <label><input type="checkbox" id="selfMute" checked> Tự Mute</label>
            <label><input type="checkbox" id="selfDeaf" checked> Tự Deaf</label>
        </div>

        <div class="btn-group">
            <button class="btn-connect" onclick="action('connect')">Bắt đầu Treo Voice</button>
            <button class="btn-disconnect" onclick="action('disconnect')">Ngắt kết nối</button>
        </div>

        <div id="status" class="toast"></div>
    </div>

    <script>
        function showToast(msg, type = 'info') {
            const box = document.getElementById('status');
            box.style.display = 'block';
            box.style.background = type === 'success' ? '#064e3b' : (type === 'error' ? '#7f1d1d' : '#334155');
            box.innerText = msg;
        }

        async function action(type) {
            const token = document.getElementById('token').value.trim();
            const channelId = document.getElementById('channelId').value.trim();

            if (!token) return showToast('Vui lòng nhập Token Discord!', 'error');
            if (type === 'connect' && !channelId) return showToast('Vui lòng nhập ID Kênh Thoại!', 'error');

            showToast('Đang xử lý yêu cầu...', 'info');
            const endpoint = type === 'connect' ? '/api/connect' : '/api/disconnect';

            try {
                const res = await fetch(endpoint, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        token,
                        channelId,
                        selfMute: document.getElementById('selfMute').checked,
                        selfDeaf: document.getElementById('selfDeaf').checked
                    })
                });
                const data = await res.json();

                if (data.success && type === 'connect') {
                    localStorage.setItem('zpa_session_id', data.sessionId);
                    showToast(`${data.message}! Đang chuyển sang trang Cài đặt & Live Chat...`, 'success');
                    setTimeout(() => {
                        window.location.href = data.settingUrl;
                    }, 900);
                } else {
                    if (data.success) localStorage.removeItem('zpa_session_id');
                    showToast(data.message, data.success ? 'success' : 'error');
                }
            } catch (err) {
                showToast('Không thể kết nối tới máy chủ!', 'error');
            }
        }
    </script>
</body>
</html>
