<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Treo Voice Discord (haz)</title>
    <style>
        body { background: #0f172a; color: #fff; font-family: sans-serif; padding: 20px; display: flex; justify-content: center; }
        .card { background: #1e293b; padding: 25px; border-radius: 8px; width: 100%; max-width: 600px; }
        .alert { background: #450a0a; color: #fca5a5; padding: 12px; border-radius: 6px; margin-bottom: 20px; font-size: 14px; }
        label { display: block; margin-top: 15px; font-weight: bold; }
        input[type="text"] { width: 100%; padding: 10px; margin-top: 5px; background: #0f172a; border: 1px solid #334155; color: #fff; border-radius: 4px; box-sizing: border-box; }
        .switches { display: flex; gap: 20px; margin: 20px 0; }
        .btn-group { display: flex; gap: 10px; }
        button { flex: 1; padding: 12px; color: #fff; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; }
        .btn-connect { background: #2563eb; }
        .btn-connect:hover { background: #1d4ed8; }
        .btn-disconnect { background: #dc2626; }
        .btn-disconnect:hover { background: #b91c1c; }
        #status { margin-top: 15px; padding: 10px; border-radius: 4px; display: none; line-height: 1.5; }
    </style>
</head>
<body>
    <div class="card">
        <h2>Treo Voice Discord (haz)</h2>
        <div class="alert">⚠️ BẮT BƯỘC: Bật Tự Mute và Tự Deaf để bảo vệ tài khoản khỏi Discord quét!</div>
        
        <label>Token Tài Khoản Discord</label>
        <input type="text" id="token" placeholder="Nhập User Token của bạn...">

        <label>ID Kênh Thoại (Voice Channel ID)</label>
        <input type="text" id="channelId" placeholder="VD: 1530967867481395213">

        <div class="switches">
            <label><input type="checkbox" id="selfMute" checked> Tự Mute</label>
            <label><input type="checkbox" id="selfDeaf" checked> Tự Deaf</label>
        </div>

        <div class="btn-group">
            <button class="btn-connect" onclick="action('connect')">Bắt đầu Treo Voice</button>
            <button class="btn-disconnect" onclick="action('disconnect')">Ngắt kết nối</button>
        </div>

        <div id="status"></div>
    </div>

    <script>
        async function action(type) {
            const statusDiv = document.getElementById('status');
            const token = document.getElementById('token').value.trim();
            const channelId = document.getElementById('channelId').value.trim();

            if (!token) return alert('Vui lòng nhập Token!');
            if (type === 'connect' && !channelId) return alert('Vui lòng nhập ID Kênh Thoại!');

            statusDiv.style.display = 'block';
            statusDiv.style.background = '#334155';
            statusDiv.innerText = 'Đang xử lý yêu cầu...';

            const endpoint = type === 'connect' ? '/api/connect' : '/api/disconnect';
            try {
                const res = await fetch(endpoint, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        token,
                        channelId,
                        selfMute: document.getElementById('selfMute').checked,
                        selfDeaf: document.getElementById('selfDeaf').checked
                    })
                });

                const data = await res.json();
                statusDiv.style.background = data.success ? '#064e3b' : '#7f1d1d';

                if (data.success && type === 'connect') {
                    statusDiv.innerText = `${data.message}! Đang chuyển hướng sang trang Cài Đặt & Auto Chat...`;
                    setTimeout(() => {
                        window.location.href = data.settingUrl || `/setting?token=${encodeURIComponent(token)}`;
                    }, 1000);
                } else {
                    statusDiv.innerText = data.message;
                }
            } catch (err) {
                statusDiv.style.background = '#7f1d1d';
                statusDiv.innerText = 'Có lỗi xảy ra khi kết nối máy chủ!';
            }
        }
    </script>
</body>
</html>
