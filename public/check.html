<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trạng Thái Treo Voice</title>
    <style>
        * { box-sizing: border-box; }
        body { background: #0b0f19; color: #fff; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; padding: 16px; margin: 0; display: flex; justify-content: center; }
        .card { background: #161e2e; border: 1px solid #2d3748; padding: 22px; border-radius: 14px; width: 100%; max-width: 680px; }
        .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #334155; padding-bottom: 14px; gap: 10px; flex-wrap: wrap; }
        .badge { background: #059669; padding: 5px 13px; border-radius: 20px; font-weight: bold; font-size: 13px; }
        table { width: 100%; border-collapse: collapse; margin-top: 16px; font-size: 14px; }
        th, td { text-align: left; padding: 12px 10px; border-bottom: 1px solid #2d3748; }
        th { background: #0f172a; color: #94a3b8; }
        .status-dot { height: 9px; width: 9px; background-color: #10b981; border-radius: 50%; display: inline-block; margin-right: 6px; }
        a.back { color: #38bdf8; text-decoration: none; font-size: 13px; font-weight: 600; }
    </style>
</head>
<body>
    <div class="card">
        <div class="header">
            <div>
                <a href="/" class="back">← Quay lại trang chủ</a>
                <h2 style="margin: 6px 0 0 0;">Hệ Thống Treo Voice</h2>
            </div>
            <div class="badge">Đang treo: <span id="total">0</span> acc</div>
        </div>

        <table>
            <thead>
                <tr>
                    <th>Tài khoản (Ẩn danh)</th>
                    <th>Server</th>
                    <th>Trạng thái</th>
                    <th>Thời gian treo</th>
                </tr>
            </thead>
            <tbody id="list">
                <tr><td colspan="4" style="text-align:center;">Đang tải dữ liệu...</td></tr>
            </tbody>
        </table>
    </div>

    <script>
        function formatUptime(ms) {
            const sec = Math.floor((Date.now() - ms) / 1000);
            const hrs = Math.floor(sec / 3600);
            const mins = Math.floor((sec % 3600) / 60);
            return `${hrs}h ${mins}m`;
        }

        async function fetchStatus() {
            try {
                const res = await fetch('/api/status');
                const data = await res.json();
                document.getElementById('total').innerText = data.total;
                const tbody = document.getElementById('list');
                tbody.innerHTML = '';

                if (!data.accounts || data.accounts.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="4" style="text-align:center; color:#94a3b8;">Hiện chưa có tài khoản nào treo.</td></tr>';
                    return;
                }

                data.accounts.forEach(acc => {
                    const tr = document.createElement('tr');
                    tr.innerHTML = `
                        <td><strong>${acc.name}</strong></td>
                        <td style="color:#cbd5e1;">${acc.server || 'Discord'}</td>
                        <td><span class="status-dot"></span>Online</td>
                        <td>${formatUptime(acc.connectedAt)}</td>
                    `;
                    tbody.appendChild(tr);
                });
            } catch (e) {}
        }

        fetchStatus();
        setInterval(fetchStatus, 5000);
    </script>
</body>
</html>
