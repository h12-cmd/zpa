<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Trạng Thái Treo Voice</title>
    <style>
        body { background: #0f172a; color: #fff; font-family: sans-serif; padding: 20px; display: flex; justify-content: center; }
        .card { background: #1e293b; padding: 25px; border-radius: 8px; width: 100%; max-width: 600px; }
        .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #334155; padding-bottom: 15px; }
        .badge { background: #059669; padding: 4px 12px; border-radius: 20px; font-weight: bold; font-size: 14px; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { text-align: left; padding: 12px; border-bottom: 1px solid #334155; }
        th { background: #0f172a; color: #94a3b8; }
        .status-dot { height: 10px; width: 10px; background-color: #10b981; border-radius: 50%; display: inline-block; margin-right: 5px; }
    </style>
</head>
<body>
    <div class="card">
        <div class="header">
            <h2>Hệ Thống Treo Voice</h2>
            <div class="badge">Đang treo: <span id="total">0</span> acc</div>
        </div>

        <table>
            <thead>
                <tr>
                    <th>Tài khoản (Ẩn danh)</th>
                    <th>Trạng thái</th>
                    <th>Thời gian treo</th>
                </tr>
            </thead>
            <tbody id="list">
                <tr><td colspan="3" style="text-align:center;">Đang tải dữ liệu...</td></tr>
            </tbody>
        </table>
    </div>

    <script>
        function formatUptime(ms) {
            const sec = Math.floor((Date.now() - ms) / 1000);
            const hrs = Math.floor(sec / 3600);
            const mins = Math.floor((sec % 3600) / 60);
            return `${hrs}h ${mins}m`;
        }

        async function fetchStatus() {
            try {
                const res = await fetch('/api/status');
                const data = await res.json();
                
                document.getElementById('total').innerText = data.total;
                const tbody = document.getElementById('list');
                tbody.innerHTML = '';

                if (data.accounts.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="3" style="text-align:center; color:#94a3b8;">Hiện chưa có tài khoản nào treo.</td></tr>';
                    return;
                }

                data.accounts.forEach(acc => {
                    const row = `
                        <tr>
                            <td><strong>${acc.name}</strong></td>
                            <td><span class="status-dot"></span> Online</td>
                            <td>${formatUptime(acc.connectedAt)}</td>
                        </tr>
                    `;
                    tbody.innerHTML += row;
                });
            } catch (e) {}
        }

        fetchStatus();
        setInterval(fetchStatus, 5000); // Tự động cập nhật mỗi 5 giây
    </script>
</body>
</html>
