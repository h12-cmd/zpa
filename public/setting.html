<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cài Đặt & Live Chat - Discord Control</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background: #0b0f19; color: #f1f5f9; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 16px; }
        .container { width: 100%; max-width: 820px; background: #161e2e; border: 1px solid #2d3748; border-radius: 16px; box-shadow: 0 20px 30px rgba(0, 0, 0, 0.5); overflow: hidden; }
        .top-bar { background: #1e293b; padding: 16px 20px; border-bottom: 1px solid #2d3748; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
        .top-bar input { flex: 1; min-width: 220px; background: #0f172a; border: 1px solid #334155; padding: 11px 14px; border-radius: 8px; color: #38bdf8; font-family: monospace; font-size: 13px; outline: none; }
        .btn-load { background: #2563eb; color: #fff; font-weight: 600; padding: 11px 18px; border: none; border-radius: 8px; cursor: pointer; }
        .btn-home { background: #334155; color: #fff; text-decoration: none; font-weight: 600; padding: 11px 14px; border-radius: 8px; font-size: 13px; }
        .toast-banner { display: none; padding: 10px 20px; font-size: 13px; font-weight: 600; }
        .main-content { padding: 22px; display: none; }
        .profile-card { background: #0f172a; border: 1px solid #2d3748; border-radius: 12px; padding: 16px 18px; display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 22px; }
        .user-info { display: flex; align-items: center; gap: 14px; }
        .avatar-placeholder { width: 46px; height: 46px; background: linear-gradient(135deg, #6366f1, #a855f7); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 19px; color: #fff; }
        .user-details h3 { font-size: 16px; color: #f8fafc; }
        .user-details p { font-size: 12px; color: #94a3b8; font-family: monospace; margin-top: 3px; }
        .status-badge { display: flex; align-items: center; gap: 8px; background: rgba(16, 185, 129, 0.12); border: 1px solid rgba(16, 185, 129, 0.3); padding: 6px 14px; border-radius: 20px; font-size: 13px; font-weight: 600; color: #10b981; }
        .status-dot { width: 8px; height: 8px; background: #10b981; border-radius: 50%; }
        .status-badge.offline { background: rgba(239, 68, 68, 0.12); border-color: rgba(239, 68, 68, 0.3); color: #ef4444; }
        .status-badge.offline .status-dot { background: #ef4444; }
        .section-title { font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; color: #38bdf8; margin-bottom: 12px; }
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 18px; }
        .form-group { margin-bottom: 16px; }
        .form-group label { display: block; font-size: 13px; font-weight: 600; color: #94a3b8; margin-bottom: 6px; }
        .form-group input[type="text"] { width: 100%; background: #0f172a; border: 1px solid #334155; padding: 11px 13px; border-radius: 8px; color: #f8fafc; font-size: 14px; outline: none; }
        .switch-card { background: #0f172a; border: 1px solid #334155; border-radius: 8px; padding: 11px 14px; display: flex; justify-content: space-between; align-items: center; }
        .switch { position: relative; display: inline-block; width: 44px; height: 24px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #334155; transition: .25s; border-radius: 24px; }
        .slider:before { position: absolute; content: ""; height: 18px; width: 18px; left: 3px; bottom: 3px; background-color: white; transition: .25s; border-radius: 50%; }
        input:checked + .slider { background-color: #2563eb; }
        input:checked + .slider:before { transform: translateX(20px); }
        .chat-box { background: #080c14; border: 1px solid #1e293b; border-radius: 8px 8px 0 0; padding: 14px; font-family: monospace; font-size: 12.5px; color: #38bdf8; height: 190px; overflow-y: auto; line-height: 1.55; display: flex; flex-direction: column-reverse; }
        .chat-input-row { display: flex; gap: 8px; background: #0f172a; border: 1px solid #1e293b; border-top: none; padding: 10px; border-radius: 0 0 8px 8px; }
        .chat-input-row input { flex: 1; background: #161e2e; border: 1px solid #334155; padding: 10px 12px; border-radius: 6px; color: #fff; font-size: 13px; outline: none; }
        .btn-send { background: #10b981; color: #fff; border: none; padding: 10px 18px; border-radius: 6px; font-weight: 600; cursor: pointer; }
        .terminal-box { background: #080c14; border: 1px solid #1e293b; border-radius: 8px; padding: 12px; font-family: monospace; font-size: 12px; color: #cbd5e1; height: 100px; overflow-y: auto; line-height: 1.5; }
        .action-row { display: flex; gap: 10px; margin-top: 22px; flex-wrap: wrap; }
        .btn-action { flex: 1; min-width: 140px; padding: 13px; border: none; border-radius: 8px; font-weight: 700; font-size: 13.5px; cursor: pointer; }
        .btn-save { background: #2563eb; color: #fff; }
        .btn-reconnect { background: #0d9488; color: #fff; }
        .btn-danger { background: rgba(239, 68, 68, 0.12); border: 1px solid rgba(239, 68, 68, 0.35); color: #ef4444; }
    </style>
</head>
<body>
<div class="container">
    <div class="top-bar">
        <a href="/" class="btn-home">← Trang chủ</a>
        <input type="text" id="lookupInput" placeholder="Nhập Mã Phiên (Session ID) hoặc Token Discord...">
        <button class="btn-load" onclick="loadSettings()">Tải Cấu Hình</button>
    </div>
    <div id="banner" class="toast-banner"></div>

    <div class="main-content" id="settings-form">
        <div class="profile-card">
            <div class="user-info">
                <div class="avatar-placeholder" id="avatar-char">U</div>
                <div class="user-details">
                    <h3 id="display-username">Đang tải...</h3>
                    <p id="display-userid">ID: ---</p>
                    <p id="display-server" style="color:#38bdf8;">Phòng: ---</p>
                </div>
            </div>
            <div class="status-badge" id="status-badge">
                <span class="status-dot"></span>
                <span id="status-text">Online</span>
            </div>
        </div>

        <div class="section-title">Cấu Hình Voice Treo</div>
        <div class="form-group">
            <label>ID Kênh Thoại (Voice Channel ID)</label>
            <input type="text" id="channelId" placeholder="VD: 1530967867481395213">
        </div>

        <div class="grid-2">
            <div class="switch-card">
                <span style="font-size:13px; font-weight:600;">Tự Mute</span>
                <label class="switch"><input type="checkbox" id="selfMute"><span class="slider"></span></label>
            </div>
            <div class="switch-card">
                <span style="font-size:13px; font-weight:600;">Tự Deaf</span>
                <label class="switch"><input type="checkbox" id="selfDeaf"><span class="slider"></span></label>
            </div>
        </div>

        <hr style="border: none; border-top: 1px solid #2d3748; margin: 22px 0;">

        <div class="section-title">Khung Chat Trực Tiếp (Realtime SSE)</div>
        <div class="form-group">
            <label>ID Kênh Chat (Text Channel ID)</label>
            <input type="text" id="textChannelId" placeholder="Nhập ID kênh chat để theo dõi & nhắn tin...">
        </div>

        <div class="chat-box" id="chatLogs"><div>Chưa có tin nhắn...</div></div>
        <div class="chat-input-row">
            <input type="text" id="msgInput" placeholder="Nhập tin nhắn gửi thẳng vào Discord..." onkeydown="if(event.key==='Enter') sendMessage()">
            <button class="btn-send" onclick="sendMessage()">Gửi Tin</button>
        </div>

        <div class="section-title" style="margin-top: 22px;">Nhật Ký Hệ Thống</div>
        <div class="terminal-box" id="logs">Đang tải nhật ký...</div>

        <div class="action-row">
            <button class="btn-action btn-save" onclick="saveSettings()">💾 Lưu Cài Đặt</button>
            <button class="btn-action btn-reconnect" onclick="reconnectAcc()">🔄 Kết Nối Lại</button>
            <button class="btn-action btn-danger" onclick="disconnectAcc()">🔴 Ngắt Kết Nối</button>
        </div>
    </div>
</div>

<script>
    const urlParams = new URLSearchParams(window.location.search);
    let activeSessionId = urlParams.get('id') || localStorage.getItem('zpa_session_id') || '';
    let eventSource = null;

    function notify(msg, ok = true) {
        const b = document.getElementById('banner');
        b.style.display = 'block';
        b.style.background = ok ? '#064e3b' : '#7f1d1d';
        b.style.color = '#fff';
        b.innerText = msg;
        setTimeout(() => { b.style.display = 'none'; }, 4000);
    }

    function renderList(containerId, items, emptyText) {
        const el = document.getElementById(containerId);
        el.innerHTML = '';
        if (!items || items.length === 0) {
            const span = document.createElement('span');
            span.style.color = '#64748b';
            span.innerText = emptyText;
            el.appendChild(span);
            return;
        }
        items.forEach(line => {
            const div = document.createElement('div');
            div.textContent = line;
            el.appendChild(div);
        });
    }

    function updateStatusUI(isOnline, guildName, channelName) {
        const badge = document.getElementById('status-badge');
        const statusText = document.getElementById('status-text');
        if (isOnline) {
            badge.className = 'status-badge';
            statusText.innerText = 'Online';
        } else {
            badge.className = 'status-badge offline';
            statusText.innerText = 'Offline';
        }
        if (guildName || channelName) {
            document.getElementById('display-server').innerText = `Phòng: ${guildName || '?'} / ${channelName || '?'}`;
        }
    }

    function startRealtimeStream(sessionId) {
        if (eventSource) eventSource.close();
        eventSource = new EventSource(`/api/user/stream?id=${encodeURIComponent(sessionId)}`);
        eventSource.onmessage = (event) => {
            try {
                const payload = JSON.parse(event.data);
                if (payload.type === 'chat') renderList('chatLogs', payload.chatLogs, 'Chưa có tin nhắn nào.');
                if (payload.type === 'log') renderList('logs', payload.logs, 'Chưa có nhật ký.');
                if (payload.type === 'status') {
                    if (payload.username) document.getElementById('display-username').innerText = payload.username;
                    if (payload.userId) document.getElementById('display-userid').innerText = `ID: ${payload.userId}`;
                    updateStatusUI(payload.isOnline, payload.guildName, payload.channelName);
                }
            } catch (e) {}
        };
    }

    async function loadSettings(overrideInput) {
        const raw = (overrideInput || document.getElementById('lookupInput').value || '').trim();
        if (!raw) return notify('Vui lòng nhập Mã Phiên hoặc Token!', false);

        const body = raw.length === 24 && !raw.includes('.') ? { sessionId: raw } : { token: raw };

        try {
            const res = await fetch('/api/user/get-settings', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(body)
            });
            const data = await res.json();
            if (!data.success) return notify(data.message, false);

            const d = data.data;
            activeSessionId = d.sessionId;
            localStorage.setItem('zpa_session_id', activeSessionId);
            document.getElementById('lookupInput').value = activeSessionId;
            window.history.replaceState({}, '', `/setting?id=${encodeURIComponent(activeSessionId)}`);

            document.getElementById('settings-form').style.display = 'block';
            document.getElementById('display-username').innerText = d.username;
            document.getElementById('display-userid').innerText = `ID: ${d.userId} | Reconnect: ${d.reconnectCount} lần`;
            document.getElementById('avatar-char').innerText = (d.username || 'U').charAt(0).toUpperCase();

            updateStatusUI(d.isOnline, d.guildName, d.channelName);
            document.getElementById('channelId').value = d.channelId || '';
            document.getElementById('selfMute').checked = Boolean(d.selfMute);
            document.getElementById('selfDeaf').checked = Boolean(d.selfDeaf);
            document.getElementById('textChannelId').value = d.textChannelId || '';

            renderList('chatLogs', d.chatLogs, 'Chưa có tin nhắn nào trong kênh.');
            renderList('logs', d.logs, 'Chưa có dữ liệu nhật ký.');
            startRealtimeStream(activeSessionId);
        } catch (e) {
            notify('Lỗi khi tải cấu hình!', false);
        }
    }

    async function sendMessage() {
        const input = document.getElementById('msgInput');
        const text = input.value.trim();
        if (!text || !activeSessionId) return;

        input.value = '';
        try {
            const res = await fetch('/api/user/send-message', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ sessionId: activeSessionId, message: text })
            });
            const data = await res.json();
            if (!data.success) notify(data.message, false);
        } catch (e) {
            notify('Không thể gửi tin nhắn!', false);
        }
    }

    async function saveSettings() {
        if (!activeSessionId) return;
        try {
            const res = await fetch('/api/user/update-settings', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    sessionId: activeSessionId,
                    channelId: document.getElementById('channelId').value.trim(),
                    selfMute: document.getElementById('selfMute').checked,
                    selfDeaf: document.getElementById('selfDeaf').checked,
                    textChannelId: document.getElementById('textChannelId').value.trim()
                })
            });
            const data = await res.json();
            notify(data.message, data.success);
        } catch (e) {
            notify('Lỗi khi lưu cài đặt!', false);
        }
    }

    async function reconnectAcc() {
        if (!activeSessionId) return;
        try {
            const res = await fetch('/api/user/reconnect', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ sessionId: activeSessionId })
            });
            const data = await res.json();
            notify(data.message, data.success);
        } catch (e) {}
    }

    async function disconnectAcc() {
        if (!activeSessionId || !confirm('Ngắt kết nối và xóa phiên treo Voice này?')) return;
        try {
            await fetch('/api/disconnect', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ sessionId: activeSessionId })
            });
            localStorage.removeItem('zpa_session_id');
            window.location.href = '/';
        } catch (e) {}
    }

    if (activeSessionId) {
        document.getElementById('lookupInput').value = activeSessionId;
        loadSettings(activeSessionId);
    }
</script>
</body>
</html>
