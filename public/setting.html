<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cài Đặt & Live Chat - Discord Control</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; transition: all 0.2s ease; }
        body { background: #0b0f19; color: #f1f5f9; font-family: 'Inter', sans-serif; min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 20px; }
        
        .container { width: 100%; max-width: 800px; background: #161e2e; border: 1px solid #2d3748; border-radius: 16px; box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5); overflow: hidden; }
        
        .top-bar { background: #1e293b; padding: 20px; border-bottom: 1px solid #2d3748; display: flex; gap: 12px; align-items: center; }
        .top-bar input { flex: 1; background: #0f172a; border: 1px solid #334155; padding: 12px 16px; border-radius: 8px; color: #38bdf8; font-family: 'Fira Code', monospace; font-size: 13px; outline: none; }
        .btn-load { background: #2563eb; color: #fff; font-weight: 600; padding: 12px 20px; border: none; border-radius: 8px; cursor: pointer; }
        .btn-load:hover { background: #1d4ed8; }

        .main-content { padding: 25px; display: none; }
        
        .profile-card { background: #0f172a; border: 1px solid #2d3748; border-radius: 12px; padding: 18px 20px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; }
        .user-info { display: flex; align-items: center; gap: 15px; }
        .avatar-placeholder { width: 48px; height: 48px; background: linear-gradient(135deg, #6366f1, #a855f7); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 20px; color: #fff; }
        .user-details h3 { font-size: 16px; font-weight: 700; color: #f8fafc; }
        .user-details p { font-size: 12px; color: #64748b; font-family: 'Fira Code', monospace; }
        .status-badge { display: flex; align-items: center; gap: 8px; background: rgba(16, 185, 129, 0.1); border: 1px solid rgba(16, 185, 129, 0.2); padding: 6px 14px; border-radius: 20px; font-size: 13px; font-weight: 600; color: #10b981; }
        .status-dot { width: 8px; height: 8px; background: #10b981; border-radius: 50%; }
        .status-badge.offline { background: rgba(239, 68, 68, 0.1); border-color: rgba(239, 68, 68, 0.2); color: #ef4444; }
        .status-badge.offline .status-dot { background: #ef4444; }

        .section-title { font-size: 14px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; color: #38bdf8; margin-bottom: 15px; }
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 20px; }
        
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; font-size: 13px; font-weight: 600; color: #94a3b8; margin-bottom: 8px; }
        .form-group input[type="text"] { width: 100%; background: #0f172a; border: 1px solid #334155; padding: 12px; border-radius: 8px; color: #f8fafc; font-size: 14px; outline: none; }

        .switch-card { background: #0f172a; border: 1px solid #334155; border-radius: 8px; padding: 12px 16px; display: flex; justify-content: space-between; align-items: center; }
        .switch { position: relative; display: inline-block; width: 44px; height: 24px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #334155; transition: .3s; border-radius: 24px; }
        .slider:before { position: absolute; content: ""; height: 18px; width: 18px; left: 3px; bottom: 3px; background-color: white; transition: .3s; border-radius: 50%; }
        input:checked + .slider { background-color: #2563eb; }
        input:checked + .slider:before { transform: translateX(20px); }

        /* Live Chat Terminal Box */
        .chat-box { background: #080c14; border: 1px solid #1e293b; border-radius: 8px 8px 0 0; padding: 15px; font-family: 'Fira Code', monospace; font-size: 12px; color: #38bdf8; height: 180px; overflow-y: auto; line-height: 1.6; display: flex; flex-direction: column-reverse; }
        .chat-input-row { display: flex; gap: 8px; background: #0f172a; border: 1px solid #1e293b; border-top: none; padding: 10px; border-radius: 0 0 8px 8px; }
        .chat-input-row input { flex: 1; background: #161e2e; border: 1px solid #334155; padding: 10px; border-radius: 6px; color: #fff; font-size: 13px; outline: none; }
        .btn-send { background: #10b981; color: #fff; border: none; padding: 10px 18px; border-radius: 6px; font-weight: 600; cursor: pointer; }
        .btn-send:hover { background: #059669; }

        .terminal-box { background: #080c14; border: 1px solid #1e293b; border-radius: 8px; padding: 12px; font-family: 'Fira Code', monospace; font-size: 12px; color: #cbd5e1; height: 90px; overflow-y: auto; line-height: 1.5; }

        .action-row { display: flex; gap: 15px; margin-top: 25px; }
        .btn-action { flex: 1; padding: 14px; border: none; border-radius: 8px; font-weight: 700; font-size: 14px; cursor: pointer; }
        .btn-save { background: #2563eb; color: #fff; }
        .btn-danger { background: rgba(239, 68, 68, 0.1); border: 1px solid rgba(239, 68, 68, 0.3); color: #ef4444; }
    </style>
</head>
<body>

<div class="container">
    <div class="top-bar">
        <input type="text" id="token" placeholder="Dán Token Discord của bạn vào đây...">
        <button class="btn-load" onclick="loadSettings()">🔍 Tải Cấu Hình</button>
    </div>

    <div class="main-content" id="settings-form">
        <div class="profile-card">
            <div class="user-info">
                <div class="avatar-placeholder" id="avatar-char">U</div>
                <div class="user-details">
                    <h3 id="display-username">Loading...</h3>
                    <p id="display-userid">ID: ---------------</p>
                </div>
            </div>
            <div class="status-badge" id="status-badge">
                <span class="status-dot"></span>
                <span id="status-text">Online</span>
            </div>
        </div>

        <div class="section-title">🔊 Cấu Hình Voice Treo</div>
        <div class="form-group">
            <label>ID Kênh Thoại (Voice Channel ID)</label>
            <input type="text" id="channelId" placeholder="VD: 1530967867481395213">
        </div>

        <div class="grid-2">
            <div class="switch-card">
                <span style="font-size:13px; font-weight:600;">Tự Mute</span>
                <label class="switch"><input type="checkbox" id="selfMute"><span class="slider"></span></label>
            </div>
            <div class="switch-card">
                <span style="font-size:13px; font-weight:600;">Tự Deaf</span>
                <label class="switch"><input type="checkbox" id="selfDeaf"><span class="slider"></span></label>
            </div>
        </div>

        <hr style="border: none; border-top: 1px solid #2d3748; margin: 25px 0;">

        <!-- Live Chat Section -->
        <div class="section-title">💬 Khung Chat Trực Tiếp (Live Chat Monitor)</div>
        <div class="form-group">
            <label>ID Kênh Chat (Text Channel ID)</label>
            <input type="text" id="textChannelId" placeholder="Nhập ID kênh chat để xem & gửi tin nhắn...">
        </div>

        <div class="chat-box" id="chatLogs">
            <div>Chưa có tin nhắn...</div>
        </div>
        <div class="chat-input-row">
            <input type="text" id="msgInput" placeholder="Nhập tin nhắn để gửi trực tiếp vào phòng..." onkeypress="if(event.key==='Enter') sendMessage()">
            <button class="btn-send" onclick="sendMessage()">Gửi Tin</button>
        </div>

        <!-- Log Lỗi -->
        <div class="section-title" style="margin-top: 25px;">💻 Nhật Ký Lỗi & Trạng Thái</div>
        <div class="terminal-box" id="logs">Loading logs...</div>

        <div class="action-row">
            <button class="btn-action btn-save" onclick="saveSettings()">💾 Lưu Cài Đặt</button>
            <button class="btn-action btn-danger" onclick="disconnectAcc()">🔴 Ngắt Kết Nối</button>
        </div>
    </div>
</div>

<script>
    const urlParams = new URLSearchParams(window.location.search);
    let currentToken = urlParams.get('token') || '';
    let autoRefreshInterval = null;

    if (currentToken) {
        document.getElementById('token').value = currentToken;
        loadSettings();
    }

    async function loadSettings() {
        currentToken = document.getElementById('token').value.trim();
        if (!currentToken) return alert('Vui lòng nhập Token Discord!');

        try {
            const res = await fetch('/api/user/get-settings', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ token: currentToken })
            });

            const data = await res.json();
            if (data.success) {
                document.getElementById('settings-form').style.display = 'block';
                
                document.getElementById('display-username').innerText = data.data.username || 'Unknown User';
                document.getElementById('display-userid').innerText = `ID: ${data.data.userId || 'N/A'}`;
                document.getElementById('avatar-char').innerText = (data.data.username || 'U').charAt(0).toUpperCase();

                const badge = document.getElementById('status-badge');
                const statusText = document.getElementById('status-text');
                if (data.data.isOnline) {
                    badge.className = 'status-badge';
                    statusText.innerText = 'Online';
                } else {
                    badge.className = 'status-badge offline';
                    statusText.innerText = 'Offline';
                }

                document.getElementById('channelId').value = data.data.channelId || '';
                document.getElementById('selfMute').checked = !!data.data.selfMute;
                document.getElementById('selfDeaf').checked = !!data.data.selfDeaf;
                document.getElementById('textChannelId').value = data.data.textChannelId || '';

                // Hiển thị tin nhắn Chat realtime
                const chatContainer = document.getElementById('chatLogs');
                if (data.data.chatLogs && data.data.chatLogs.length > 0) {
                    chatContainer.innerHTML = data.data.chatLogs.map(log => `<div>${log}</div>`).join('');
                } else {
                    chatContainer.innerHTML = '<span style="color: #64748b;">Chưa có tin nhắn nào trong kênh.</span>';
                }

                // Hiển thị Log hệ thống
                const logContainer = document.getElementById('logs');
                if (data.data.logs && data.data.logs.length > 0) {
                    logContainer.innerHTML = data.data.logs.map(log => `<div>${log}</div>`).join('');
                } else {
                    logContainer.innerHTML = '<span style="color: #64748b;">Chưa có dữ liệu nhật ký.</span>';
                }

                // Tự động làm mới khung chat mỗi 3 giây
                if (!autoRefreshInterval) {
                    autoRefreshInterval = setInterval(loadSettings, 3000);
                }

            } else {
                alert(data.message);
            }
        } catch (e) {}
    }

    async function sendMessage() {
        const msgInput = document.getElementById('msgInput');
        const text = msgInput.value.trim();
        if (!text) return;

        msgInput.value = '';
        try {
            const res = await fetch('/api/user/send-message', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ token: currentToken, message: text })
            });
            const data = await res.json();
            if (!data.success) alert(data.message);
            loadSettings();
        } catch (e) {
            alert('Không thể gửi tin nhắn!');
        }
    }

    async function saveSettings() {
        const body = {
            token: currentToken,
            channelId: document.getElementById('channelId').value.trim(),
            selfMute: document.getElementById('selfMute').checked,
            selfDeaf: document.getElementById('selfDeaf').checked,
            textChannelId: document.getElementById('textChannelId').value.trim()
        };

        try {
            const res = await fetch('/api/user/update-settings', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(body)
            });

            const data = await res.json();
            alert(data.message);
            loadSettings();
        } catch (e) {
            alert('Lỗi khi lưu cài đặt!');
        }
    }

    async function disconnectAcc() {
        if (!confirm('Ngắt kết nối tài khoản?')) return;
        try {
            await fetch('/api/disconnect', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ token: currentToken })
            });
            window.location.href = '/';
        } catch (e) {}
    }
</script>

</body>
</html>
